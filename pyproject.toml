[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veloformal"
version = "1.2.0"
description = "Experimental SystemVerilog formal verification prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["lark>=1.1,<2"]

[project.scripts]
veloformal = "veloformal.__main__:main"

[tool.setuptools.packages.find]
include = ["veloformal*"]
