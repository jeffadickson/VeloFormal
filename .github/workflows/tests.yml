name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test, and report coverage with C# helper
        run: dotnet run --project tools/VeloFormal.Build -c Release -- coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/
