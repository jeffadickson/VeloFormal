[workspace]
resolver = "2"
members = [
    "crates/vf-ir",
    "crates/vf-slang",
    "crates/vf-smt",
    "crates/vf-engine",
    "crates/vf-apps",
    "crates/vf-dsl",
    "crates/vf-lsp",
    "crates/vf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
